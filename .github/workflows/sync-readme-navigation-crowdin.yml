---
name: Sync README headings and navigation to Crowdin
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'locale/**/README.md'

concurrency:
  group: crowdin-readme-navigation-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.repository_owner == 'LizardByte' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.user.login == 'LizardByte-bot' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'l10n_master'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'latest'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Update and approve localized README headings and navigation
        run: npm run sync:readme-navigation-crowdin
        env:
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
